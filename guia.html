   columna de lectura de ~70 caracteres con índice fijo a la derecha en escritorio. */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --ink:#1d1d1f; --muted:#6e6e73; --line:rgba(0,0,0,.08);
  --accent:#0a5cd5; --accent-soft:rgba(10,92,213,.09);
  --warn:#b06a00; --warn-soft:rgba(176,106,0,.08); --ok:#1a8f5c;
  --code-bg:#0f1218; --code-ink:#e6e9ef;
  --r-xl:28px; --r-lg:20px; --r-md:14px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 18px 40px -20px rgba(0,0,0,.22);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Manrope","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:"JetBrains Mono","SF Mono",Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:76px}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{width:min(1120px,100% - 40px);margin-inline:auto}
h1,h2,h3{letter-spacing:-.03em;line-height:1.1;text-wrap:balance}

.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;background:linear-gradient(90deg,var(--accent),#6a5cf0);transform-origin:0 50%;transform:scaleX(0)}
.top{position:sticky;top:0;z-index:50;background:rgba(245,245,247,.75);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;text-decoration:none}
.brand i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#142a55);display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px;font-weight:800}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:999px;transition:background .25s,color .25s}
.back:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.back svg{width:15px;height:15px}

.hero{padding:44px 0 10px}
.cover{border-radius:var(--r-xl);overflow:hidden;background:linear-gradient(135deg,var(--accent-soft),rgba(106,92,240,.12));aspect-ratio:16/7;box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent)}
.cover img{width:100%;height:100%;object-fit:cover}
.cover svg{width:64px;height:64px}
.head{max-width:760px;margin:40px 0 0}
.kicker{font-size:14px;font-weight:700;color:var(--accent);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kicker span{color:var(--muted);font-weight:500}
.head h1{font-size:clamp(38px,6vw,64px);font-weight:800;letter-spacing:-.045em;margin:12px 0 16px}
.lead{font-size:clamp(18px,2.2vw,21px);color:var(--muted);line-height:1.5}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;font-weight:600;font-size:15px;border:0;cursor:pointer;text-decoration:none;transition:transform .3s var(--ease),background .25s}
.btn:active{transform:scale(.96)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--ink);color:#fff}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.ghost:hover{background:#fafafc}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:56px;padding:44px 0 80px;align-items:start}
.toc{position:sticky;top:84px;font-size:14px}
.toc b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.toc ol{list-style:none;display:flex;flex-direction:column;gap:2px;border-left:2px solid var(--line)}
.toc a{display:block;padding:6px 0 6px 14px;margin-left:-2px;border-left:2px solid transparent;color:var(--muted);text-decoration:none;line-height:1.35;transition:color .2s,border-color .2s}
.toc a:hover{color:var(--ink)}
.toc a.on{color:var(--accent);border-left-color:var(--accent);font-weight:600}

/* Contenido de la guía */
.prose{max-width:720px;min-width:0}
.prose > *+*{margin-top:18px}
.prose h2{font-size:clamp(28px,3.6vw,36px);font-weight:800;margin-top:56px;padding-top:6px}
.prose h3{font-size:22px;font-weight:700;margin-top:40px;letter-spacing:-.02em}
.prose h2+*,.prose h3+*{margin-top:12px}
.prose p,.prose li{color:#2a2a2e}
.prose em{color:var(--muted)}
.prose a{color:var(--accent);text-underline-offset:3px}
.prose ul,.prose ol{padding-left:1.4em;display:flex;flex-direction:column;gap:8px}
.prose ol{list-style:none;counter-reset:n;padding-left:0}
.prose ol>li{counter-increment:n;position:relative;padding-left:44px}
.prose ol>li::before{content:counter(n);position:absolute;left:0;top:1px;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;display:grid;place-items:center}
.prose li::marker{color:var(--muted)}
.prose strong{font-weight:700;color:var(--ink)}
.prose :not(pre)>code{font-family:var(--mono);font-size:.84em;background:rgba(0,0,0,.055);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
.prose blockquote{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r-md);padding:16px 20px;color:#2a2a2e}
.prose blockquote.warn{border-left-color:var(--warn);background:linear-gradient(90deg,var(--warn-soft),var(--surface) 40%)}
.prose blockquote p+p{margin-top:8px}
.codebox{position:relative;border-radius:var(--r-md);background:var(--code-bg);box-shadow:0 14px 30px -18px rgba(0,0,0,.5)}
.codebox pre{overflow-x:auto;padding:18px 20px;padding-right:96px;font:400 14px/1.7 var(--mono);color:var(--code-ink)}
.codebox button{position:absolute;top:10px;right:10px;border:0;cursor:pointer;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;transition:background .2s}
.codebox button:hover{background:rgba(255,255,255,.22)}
.tablebox{overflow-x:auto;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow)}
.prose table{border-collapse:collapse;width:100%;min-width:520px;font-size:15.5px;line-height:1.5}
.prose th,.prose td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
.prose th{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:#fafafc}
.prose tr:last-child td{border-bottom:0}
.prose img{border-radius:var(--r-md)}
.prose hr{border:0;height:1px;background:var(--line);margin:40px 0}

.state{padding:90px 0;text-align:center;color:var(--muted)}
.state h1{color:var(--ink);font-size:36px;margin-bottom:10px}
.skel{border-radius:12px;background:linear-gradient(100deg,#e9e9ee 30%,#f4f4f7 50%,#e9e9ee 70%);background-size:300% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-150% 0}}

.more{border-top:1px solid var(--line);padding:56px 0 90px}
.more h2{font-size:28px;margin-bottom:22px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;list-style:none}
.mcard{display:flex;flex-direction:column;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);overflow:hidden;text-decoration:none;transition:transform .5s var(--ease)}
.mcard:hover{transform:translateY(-5px)}
.mcard .mc{aspect-ratio:16/9;background:var(--accent-soft);overflow:hidden}
.mcard .mc img{width:100%;height:100%;object-fit:cover}
.mcard b{padding:14px 18px 18px;font-size:17px;letter-spacing:-.01em}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:all .4s var(--ease);pointer-events:none;z-index:70}
.toast.show{opacity:1;transform:translate(-50%,0)}

.js .rv{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform 1s var(--ease)}
.js .rv.in{opacity:1;transform:none}

@media (max-width:960px){
  .layout{grid-template-columns:1fr;gap:0}
  .toc{display:none}
}
@media (max-width:640px){
  body{font-size:17px}
  .cover{aspect-ratio:16/10;border-radius:22px}
  .hero{padding-top:24px}
  .head{margin-top:26px}
  .btn{flex:1 1 auto;justify-content:center}
  .prose h2{margin-top:44px}
  .prose ol>li{padding-left:40px}
  .codebox pre{font-size:13px;padding:16px;padding-top:46px}
  .back span{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .js .rv{opacity:1;transform:none}
}
</style>

        var li = el("li"); var a = el("a", "mcard"); a.href = "/guias/" + o.slug;
        var mc = el("div", "mc"); var s2 = coverOf(o); if (s2) { var i2 = el("img"); i2.alt = ""; i2.loading = "lazy"; i2.src = s2; mc.append(i2); }
        a.append(mc, el("b", null, o.nombre)); li.append(a); grid.append(li);
      });
      w.append(grid); more.append(w); app.append(more);
    }

    // Revelado y barra de lectura
    var rvs = app.querySelectorAll(".rv");
    requestAnimationFrame(function(){ rvs.forEach(function(r){ r.classList.add("in"); }); });
    if (location.hash) { var t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) setTimeout(function(){ t.scrollIntoView(); }, 50); }
  }

  var bar = document.querySelector(".progress");
  addEventListener("scroll", function(){
    var h = document.documentElement.scrollHeight - innerHeight;
    bar.style.transform = "scaleX(" + (h > 0 ? scrollY / h : 0) + ")";
  }, {passive:true});

  if (!slug) { showState("Guía no encontrada", "El enlace no corresponde a ninguna guía."); return; }
  if (!sb) { showState("No se pudo cargar", "Revisa tu conexión y recarga la página."); return; }

  var slow = setTimeout(function(){ toast("Está tardando más de lo normal…"); }, 10000);
  Promise.all([
    sb.from("hub_guias").select("*").eq("slug", slug).maybeSingle(),
    sb.from("hub_guias").select("id,nombre,slug,portada_path").order("creado_en", {ascending:false}).limit(8)
  ]).then(function(r){
    clearTimeout(slow);
    if (r[0].error) throw r[0].error;
    var g = r[0].data;
    if (!g) { showState("Guía no encontrada", "Puede que la hayan movido o borrado."); return; }
    var others = (r[1].data || []);
    if (g.contenido) return render(g, g.contenido, others);
    return fetch("/guias/contenido/" + slug + ".md", {cache:"no-cache"}).then(function(res){ return res.ok ? res.text() : ""; }).catch(function(){ return ""; }).then(function(md){ render(g, md, others); });
  }).catch(function(){
    clearTimeout(slow);
    showState("No se pudo cargar", "Revisa tu conexión y recarga la página.");
  });
})();
</script>
